[package]
name = "gauntlet-host-state"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Passive release queue decisions for the future Gauntlet host observer"

[dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }

[dev-dependencies]
tempfile = "=3.27.0"

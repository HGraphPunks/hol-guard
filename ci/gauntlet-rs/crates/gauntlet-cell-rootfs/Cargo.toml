[package]
name = "gauntlet-cell-rootfs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Root PID1 filesystem constructor for the native Gauntlet apparatus"

[dependencies]
gauntlet-contracts = { path = "../gauntlet-contracts" }
gauntlet-evidence = { path = "../gauntlet-evidence" }
gauntlet-product-cell = { path = "../gauntlet-product-cell" }
libc = "=0.2.191"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.27.0"
